name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zodicog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests on SQLite (Gemini is stubbed; no key or network needed)
        run: python -m pytest
      - name: Same suite against a real Postgres
        run: python -m pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zodicog_test

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Backend deps (real backend serves /results; analyses use recorded fixtures)
        run: pip install -r ../backend/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Functional + mobile tests
        run: npx playwright test --project=desktop --project=mobile
        env:
          E2E_BACKEND: "1"
          AUTH_DEV_LINKS: "1"
          FRONTEND_URL: http://localhost:3100
      - name: Visual regression (only once Linux baselines are committed)
        run: |
          if ls e2e/__screenshots__/visual/visual.spec.ts/*-linux.png >/dev/null 2>&1; then
            npx playwright test --project=visual
          else
            echo "::notice::No Linux visual baselines committed yet - run the 'Visual baselines' workflow, then commit frontend/e2e/__screenshots__/. Skipping."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse budget (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          if-no-files-found: ignore

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend, e2e, lighthouse]
    # Opt-in: set the repo variable DEPLOY_ENABLED=true once the VPS secrets exist.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Less safe fallback: trust the host key on first contact. Prefer setting VPS_KNOWN_HOSTS.
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          fi

      - name: Run deploy script on the VPS (builds, restarts, health-checks, rolls back on failure)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '~/ZodicogAI' }}
        run: |
          # Pipe the *new* script over SSH so the deploy logic is always the
          # version being deployed, not whatever was last pulled on the server.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER_NAME@$HOST" \
            "cd $APP_DIR && git fetch --quiet origin main && git show origin/main:scripts/deploy.sh | APP_DIR=$APP_DIR bash -s -- ${{ github.sha }}"
