name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (Gemini is stubbed; no key or network needed)
        run: python -m pytest

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Less safe fallback: trust the host key on first contact. Prefer setting VPS_KNOWN_HOSTS.
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          fi

      - name: Run deploy script on the VPS (builds, restarts, health-checks, rolls back on failure)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_NAME: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '~/ZodicogAI' }}
        run: |
          # Pipe the *new* script over SSH so the deploy logic is always the
          # version being deployed, not whatever was last pulled on the server.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$USER_NAME@$HOST" \
            "cd $APP_DIR && git fetch --quiet origin main && git show origin/main:scripts/deploy.sh | APP_DIR=$APP_DIR bash -s -- ${{ github.sha }}"
